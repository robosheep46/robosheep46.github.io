<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#171919" />
    <title>内容后台｜robosheep 的小站</title>
    <link rel="stylesheet" href="./styles.css?v=100" />
    <script src="./site-config.js?v=2" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./content-store.js?v=5" defer></script>
    <script src="./admin.js?v=6" defer></script>
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-login" data-admin-login>
        <header>
          <p>ROBOSHEEP CONTENT STUDIO</p>
          <h1>登录</h1>
        </header>
        <p class="admin-setup-warning" data-config-warning hidden>Supabase 尚未配置，请先完成项目根目录中的配置说明。</p>
        <form data-login-form>
          <label>
            邮箱
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            密码
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit">登录</button>
          <p class="admin-form-message" data-login-message aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-studio" data-admin-studio hidden>
        <header class="admin-bar">
          <div>
            <p>ROBOSHEEP CONTENT STUDIO</p>
            <strong data-admin-email></strong>
          </div>
          <div class="admin-bar-actions">
            <a href="./index.html" target="_blank" rel="noopener">查看网站</a>
            <button type="button" data-sign-out>退出</button>
          </div>
        </header>

        <div class="admin-layout">
          <aside class="admin-library">
            <div class="admin-segmented" role="tablist" aria-label="内容类型">
              <button type="button" role="tab" aria-selected="true" data-kind-tab="moment">动态</button>
              <button type="button" role="tab" aria-selected="false" data-kind-tab="weekly">周报</button>
              <button type="button" role="tab" aria-selected="false" data-kind-tab="story">故事</button>
              <button type="button" role="tab" aria-selected="false" data-kind-tab="photo">照片</button>
              <button type="button" role="tab" aria-selected="false" data-comments-tab>评论</button>
            </div>
            <div data-post-controls>
              <button class="admin-new" type="button" data-new-post>新建动态</button>
              <div class="admin-post-list" data-post-list aria-live="polite"></div>
            </div>
          </aside>

          <section class="admin-editor" data-post-editor>
            <form data-post-form>
              <input type="hidden" name="id" />
              <div class="admin-editor-head">
                <div>
                  <p data-editor-kicker>新建动态</p>
                  <h1 data-editor-title>尚未保存</h1>
                </div>
                <div class="admin-editor-actions">
                  <button type="button" class="admin-danger" data-delete-post hidden>删除</button>
                  <button type="submit" class="admin-primary">保存</button>
                </div>
              </div>

              <div class="admin-fields">
                <label>
                  状态
                  <select name="status">
                    <option value="draft">草稿</option>
                    <option value="published">公开</option>
                    <option value="hidden">隐藏</option>
                  </select>
                </label>
                <label data-happened-field>
                  发生时间
                  <input type="datetime-local" name="happened_at" required />
                </label>
              </div>

              <section data-moment-fields>
                <label class="admin-block-label">
                  正文
                  <textarea name="body" rows="9" maxlength="4000" placeholder="写下这个此刻..."></textarea>
                </label>
                <label class="admin-upload-label">
                  添加图片
                  <input type="file" name="moment_images" accept="image/*" multiple />
                </label>
                <div class="admin-image-strip" data-moment-existing-images></div>
              </section>

              <section data-weekly-fields hidden>
                <label class="admin-block-label">
                  周报标题
                  <input type="text" name="title" maxlength="100" placeholder="这一周的标题" />
                </label>
                <div class="admin-sections" data-weekly-sections></div>
                <button type="button" class="admin-add-section" data-add-weekly-section>＋ 添加段落</button>
              </section>

              <section data-story-fields hidden>
                <label class="admin-block-label">
                  故事标题
                  <input type="text" name="story_title" maxlength="100" placeholder="这篇故事叫什么" />
                </label>
                <label class="admin-block-label">
                  列表简介
                  <textarea name="story_summary" rows="3" maxlength="240" placeholder="在故事列表中显示的一句话"></textarea>
                </label>
                <label class="admin-upload-label">
                  选择封面
                  <input type="file" name="story_cover" accept="image/*" />
                </label>
                <div class="admin-image-strip admin-single-image" data-story-existing-cover></div>
                <div class="admin-section-heading">
                  <div><strong>时间节点</strong><span>保存时按年月自动排序</span></div>
                </div>
                <div class="admin-sections" data-story-sections></div>
                <button type="button" class="admin-add-section" data-add-story-section>＋ 添加时间节点</button>
              </section>

              <section data-photo-fields hidden>
                <label class="admin-block-label">
                  拍摄日期
                  <input type="date" name="photo_date" />
                </label>
                <label class="admin-block-label">
                  照片标题
                  <input type="text" name="photo_title" maxlength="100" placeholder="给这张照片一个标题" />
                </label>
                <label class="admin-block-label">
                  说明
                  <textarea name="photo_body" rows="5" maxlength="1000" placeholder="记录照片背后的事情"></textarea>
                </label>
                <label class="admin-upload-label">
                  选择照片
                  <input type="file" name="photo_image" accept="image/*" />
                </label>
                <div class="admin-image-strip admin-single-image" data-photo-existing-image></div>
              </section>

              <p class="admin-save-message" data-save-message aria-live="polite"></p>
            </form>
          </section>

          <section class="admin-comments" data-comments-manager hidden>
            <header class="admin-editor-head">
              <div>
                <p>公开留言</p>
                <h1>评论管理</h1>
              </div>
              <button type="button" data-refresh-comments>刷新</button>
            </header>
            <p class="admin-comments-message" data-comments-message aria-live="polite"></p>
            <div class="admin-comments-list" data-admin-comments-list></div>
          </section>
        </div>
      </section>
    </main>

    <template id="weekly-section-editor-template">
      <article class="admin-section-editor" data-section-editor>
        <header>
          <span data-section-number>01</span>
          <button type="button" data-remove-section title="删除这一段" aria-label="删除这一段">×</button>
        </header>
        <label>
          小标题
          <input type="text" data-section-heading maxlength="100" required />
        </label>
        <label>
          正文
          <textarea data-section-body rows="7" placeholder="不同段落之间空一行"></textarea>
        </label>
        <label class="admin-upload-label">
          添加图片
          <input type="file" data-section-files accept="image/*" multiple />
        </label>
        <div class="admin-image-strip" data-section-existing-images></div>
      </article>
    </template>

    <template id="story-section-editor-template">
      <article class="admin-section-editor admin-story-node" data-story-node>
        <header>
          <span data-story-node-number>时间节点</span>
          <button type="button" data-remove-story-node title="删除这个节点" aria-label="删除这个节点">×</button>
        </header>
        <div class="admin-fields admin-node-fields">
          <label>
            年月
            <input type="month" data-story-node-month />
          </label>
          <label>
            标题
            <input type="text" data-story-node-heading maxlength="100" />
          </label>
        </div>
        <label>
          正文
          <textarea data-story-node-body rows="8" placeholder="不同段落之间空一行"></textarea>
        </label>
      </article>
    </template>
  </body>
</html>
